# Bouwt Helder bij een tag (v0.1.7) en publiceert de installer met latest.yml.
#
# Voordat er iets ingepakt of ondertekend wordt, draait de btw-test (scripts/test-btw.mjs) in de
# echte app: een tag publiceert alleen als wizard, Instellingen, de facturen, de brief en het
# btw-overzicht nog doen wat ze moeten doen.
#
# Ondertekening loopt via SignPath Foundation, dat open-sourcesoftware gratis ondertekent.
# Zolang de secrets er niet zijn, bouwt de workflow gewoon ongetekend door — handig om de
# pijplijn te testen voordat de SignPath-projecten zijn aangevraagd.
#
# Secrets: SIGNPATH_API_TOKEN en SIGNPATH_ORGANIZATION_ID.
# In SignPath aan te maken: project `helder`, signing policy `release-signing` en twee
# artifact configurations — `helder-app` (de losse bestanden uit win-unpacked) en
# `helder-installer` (de NSIS-installer). Zie docs/code-signing-policy.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Versie en tag kloppen?
        shell: bash
        run: |
          versie=$(node -p "require('./package.json').version")
          echo "package.json: $versie, tag: ${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_NAME}" == v* && "${GITHUB_REF_NAME}" != "v$versie" ]]; then
            echo "Tag ${GITHUB_REF_NAME} hoort niet bij versie $versie in package.json." >&2
            exit 1
          fi

      - name: Release-opmerkingen
        run: npm run test:release-notes

      # Een verkeerd updatekanaal merkt niemand aan de build, maar elke installatie blijft dan
      # voorgoed op zijn versie staan. Daarom vóór het inpakken al stoppen.
      - name: Updatekanaal
        run: npm run test:update-kanaal

      - name: Bouwen (frontend + types)
        run: npm run build

      # De btw-test start de echte app en loopt vijf plekken door: de wizard, Instellingen, de
      # factuur- en offerteweergave, de aanmaningsbrief en het btw-overzicht. Een tag publiceert
      # dus alleen als de app zelf nog goed werkt, en de test staat bewust vóór het inpakken en
      # ondertekenen: een gebroken btw-regel mag geen dure SignPath-aanvraag kosten. Een
      # foutmelding in de app — in de pagina of in het hoofdproces — laat de test ook zakken, net
      # als een administratie die na "wissen" niet leeg blijkt, of een onverwachte fout die niet
      # in het foutenlogboek in de gegevensmap terechtkomt, daar in Instellingen te lezen is of
      # met één knop op het klembord belandt. Zie electron/smoke-btw.cjs.
      - name: Btw-test (stichting en vereniging)
        run: node scripts/test-btw.mjs
        env:
          ELECTRON_ENABLE_LOGGING: "true"

      # Stap 1: de app-map bouwen. Hierin zitten de bestanden die Windows vertrouwt.
      - name: App-map bouwen
        run: npx electron-builder --win --dir --x64

      # Stap 2: de losse bestanden laten ondertekenen, zodat de installer ze al ondertekend inpakt.
      - name: App-map inpakken
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Compress-Archive -Path release/win-unpacked/* -DestinationPath app-unsigned.zip -Force

      - name: App-map uploaden
        id: upload-app
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: helder-app-unsigned
          path: app-unsigned.zip
          if-no-files-found: error

      - name: App-map ondertekenen
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: helder
          signing-policy-slug: release-signing
          artifact-configuration-slug: helder-app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app

      - name: Ondertekende bestanden terugzetten
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Expand-Archive -Path (Get-ChildItem signed-app -Filter *.zip | Select-Object -First 1).FullName -DestinationPath release/win-unpacked -Force

      # Stap 3: de installer bouwen bovenop de al ondertekende bestanden. In dit pad schrijft
      # electron-builder app-update.yml niet zelf, dus doen we dat hier.
      - name: Update-kanaal in de app-map zetten
        run: node scripts/app-update-yml.mjs release/win-unpacked

      # Hashcontrole: de app-map moet exact bij deze commit horen. Dit draait ná het
      # ondertekenen, zodat ook vaststaat dat de ondertekening de app-bestanden niet heeft
      # veranderd. De installer wordt hierna met --prepackaged bovenop deze map gebouwd.
      - name: App-map hoort bij deze commit?
        shell: bash
        run: node scripts/verify-build.mjs --tag "$GITHUB_REF_NAME"

      - name: Installer bouwen
        run: npx electron-builder --win nsis --x64 --prepackaged release/win-unpacked --publish never

      # Stap 4: ook de installer zelf ondertekenen.
      - name: Installer inpakken
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Compress-Archive -Path release/Helder-Setup-*.exe -DestinationPath installer-unsigned.zip -Force

      - name: Installer uploaden
        id: upload-installer
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: helder-installer-unsigned
          path: installer-unsigned.zip
          if-no-files-found: error

      - name: Installer ondertekenen
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: helder
          signing-policy-slug: release-signing
          artifact-configuration-slug: helder-installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer

      - name: Ondertekende installer terugzetten
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Expand-Archive -Path (Get-ChildItem signed-installer -Filter *.zip | Select-Object -First 1).FullName -DestinationPath release -Force

      # Stap 5: ondertekenen verandert de bytes, dus latest.yml moet opnieuw.
      - name: Update-metadata opnieuw genereren
        run: |
          node scripts/latest-yml.mjs
          node scripts/latest-yml.mjs --check

      # Laatste controle: de installer van deze versie bestaat en latest.yml hoort erbij.
      - name: Installer hoort bij deze commit?
        shell: bash
        run: node scripts/verify-build.mjs --tag "$GITHUB_REF_NAME" --installer

      - name: Handtekening controleren
        run: node scripts/verify-signature.mjs --strict
        continue-on-error: ${{ env.SIGNPATH_API_TOKEN == '' }}

      # Dezelfde punten als in de update-kaart, nu als beschrijving op de releasepagina. Zonder
      # deze stap ziet een bezoeker wel de installer, maar niet wat er veranderd is.
      - name: Releasepagina vullen
        run: node scripts/release-body.mjs

      - name: Publiceren
        uses: softprops/action-gh-release@v2
        with:
          body_path: release/release-body.md
          files: |
            release/Helder-Setup-*.exe
            release/Helder-Setup-*.exe.blockmap
            release/latest.yml
          generate_release_notes: false
          draft: false
